<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA — Notre équipe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --black:#030508;
  --white:#f5f7fa;
  --grey:#9aa3af;
  --accent:#ff6a3d;
  --line:rgba(255,255,255,.13);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:var(--black)}
body{
  color:var(--white);
  font-family:Inter,sans-serif;
  overflow-x:hidden;
}
a{text-decoration:none;color:inherit}
nav{
  position:fixed;
  top:0;left:0;right:0;
  height:76px;
  z-index:10;
  display:flex;
  align-items:center;
  background:rgba(3,5,8,.72);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
}
.nav-wrap{
  width:min(1240px,calc(100% - 48px));
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font:700 1.45rem 'Barlow Condensed',sans-serif;
  letter-spacing:.12em;
}
.logo span{color:var(--accent)}
.back{
  padding:10px 18px;
  border:1px solid var(--line);
  border-radius:7px;
  color:var(--grey);
  font-size:.78rem;
  transition:.2s ease;
}
.back:hover{
  color:var(--white);
  border-color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.05);
}
.page{
  padding-top:76px;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:
    radial-gradient(circle at 50% 35%,rgba(255,106,61,.08),transparent 30rem),
    #030508;
}
.visual{
  width:min(1536px,100%);
  position:relative;
}
.visual img{
  display:block;
  width:100%;
  height:auto;
}
.visual:after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(
    180deg,
    rgba(3,5,8,.15) 0%,
    transparent 18%,
    transparent 82%,
    rgba(3,5,8,.35) 100%
  );
}
.note{
  position:fixed;
  left:28px;
  bottom:22px;
  z-index:11;
  font: .64rem 'IBM Plex Mono',monospace;
  letter-spacing:.08em;
  color:rgba(255,255,255,.55);
  text-transform:uppercase;
}
@media(max-width:700px){
  .nav-wrap{width:calc(100% - 32px)}
  nav{height:66px}
  .page{padding-top:66px}
  .back{font-size:.7rem;padding:8px 12px}
  .note{left:16px;bottom:12px;font-size:.55rem}
}
</style>
</head>
<body>
<nav>
  <div class="nav-wrap">
    <div class="logo">NOVA<span>.</span></div>
    <a class="back" href="NOVA_Aerospace_Professional.html">← RETOUR AU SITE</a>
  </div>
</nav>

<main class="page">
  <div class="visual">
    <img src="assets/nova-equipe.png" alt="Équipe d'astronautes NOVA dans l'espace">
  </div>
</main>

<div class="note">NOVA AEROSPACE · ÉQUIPE · ACCÈS INTERNE</div>
</body>
</html>
